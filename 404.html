<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Digitech Elevators</title>
    <script type="text/javascript">
      // SPA redirect handler for GitHub Pages & static hosting
      var l = window.location;
      // If hosted under github.io/<repo-name>, keep 1 path segment.
      // If on a custom domain (e.g. www.digitechelevator.com) or root domain, keep 0 segments.
      var isGitHubProject = (l.hostname.indexOf('github.io') > -1) && (l.pathname.indexOf('/digitech-elevators') === 0);
      var pathSegmentsToKeep = isGitHubProject ? 1 : 0;

      var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var route = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath + '/?/' + route + search + l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
